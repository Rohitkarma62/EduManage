name: Phase 3 Database Foundation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"
      - "lib/core/database/**"
      - "test/core/database/**"
      - "docs/PHASE_3_DATABASE_FOUNDATION.md"
      - ".github/workflows/phase-3-database.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-3-database
  cancel-in-progress: false

jobs:
  verify-database:
    name: Generate Drift code, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'phase-3/database-foundation' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Confirm toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze Dart and Flutter sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Commit generated Drift files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/database/*.g.dart
          if git diff --cached --quiet; then
            echo "No generated Drift changes to commit."
            exit 0
          fi
          git commit -m "build(db): generate Drift database code"
          git push origin HEAD:phase-3/database-foundation
